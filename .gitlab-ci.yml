#stages - etap kotorie bydyt bipoliatsia po poradky
stages:
  - test 
  - security
  - lint

variables:
  PIP_CACHE_DIR: '$CI_PRIJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/


run_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -v
  artifacts:
    when: always
    reports:
      junit: report.xml

security_scan:
  stage: security
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
    - pip install bandit safety
  script:
    - bandit -r . -f txt -o bandit-report.txt
    - safety check -- full-report
  artifacts:
    when: always
    paths:
      - bandit-report.txt

lint_code:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8
  script:
    - flake8 . --max-line-length=120
